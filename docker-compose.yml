services:
  mysql:
    image: mysql:8.0
    container_name: degson-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: degson_dev_2026
      MYSQL_DATABASE: degson_pilot
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data:/data:ro
volumes:
  mysql_data:
