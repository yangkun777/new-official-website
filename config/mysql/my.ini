# DEGSON 试点 · 便携 MySQL 8.0.28 配置
#
# 位置刻意放在 config/（会被 git 跟踪），而不是 mysql/（被 gitignore）：
# 二进制与数据不入库，但【启动配置】必须入库，否则"删库可重建"缺一环。
#
# 用法（--defaults-file 必须是第一个参数）：
#   D:\degson-pilot\mysql\bin\mysqld.exe --defaults-file="D:\degson-pilot\config\mysql\my.ini"
#
# 本机另有一个无关的 MySQL 5.7（E:\googledownload\...\mysql57）占着默认端口 3306，
# 所以这里刻意用 3307，避免撞车。

[mysqld]
# 便携版根目录与数据目录（数据目录已被 gitignore）
basedir = D:/degson-pilot/mysql
datadir = D:/degson-pilot/mysql/data

# 刻意避开 3306（本机被另一个 MySQL 5.7 占用）
port = 3307

# 错误日志放 logs/（已 gitignore）。注意目录必须已存在，MySQL 不会自动创建。
log-error = D:/degson-pilot/logs/mysqld.err

# 全库统一字符集，避免 M0.2 那种三种 collation 混用
character-set-server = utf8mb4
collation-server = utf8mb4_0900_ai_ci

# 试点规模，不需要太大
max_connections = 200
innodb_buffer_pool_size = 256M
